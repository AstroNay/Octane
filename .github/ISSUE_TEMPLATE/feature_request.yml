name: Feature Idea
description: A new idea that isn't scoped yet (turn it into a Task once it's planned)
title: "[Idea]: "
labels: ["type:feature", "needs:triage"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would the player do or see?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it's worth it
      description: What problem it solves or which pillar it serves (RPG first, a town worth walking, solo-friendly, fair competition, sized for one dev).
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References and inspiration
      description: Games, screenshots, Kanban updates, Discord threads.
    validations:
      required: false

  - type: dropdown
    id: stage
    attributes:
      label: When it might fit
      options:
        - Alpha
        - Beta
        - Early Access
        - Post-EA update
        - Not sure
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks and open questions
      description: Licensing, age rating, scope, server cost, balance.
    validations:
      required: false
