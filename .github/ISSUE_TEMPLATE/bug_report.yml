name: Bug Report
description: Something is broken in OctaneRPG
title: "[Bug]: "
labels: ["type:bug", "needs:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Internal tracker. In-game reports from the bug button arrive in this same format.
        Triage sets stack:*, sys:*, prio:* and the milestone.

  - type: input
    id: build
    attributes:
      label: Build version
      description: Shown on the main menu (e.g. 0.2.0-alpha). Use "Editor" for Play mode.
      placeholder: 0.2.0-alpha
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Unity game
        - API / server
        - Website (octanerpg.com)
        - Discord bot (legacy)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Economy (store, scrapyard, lottery, rewards)
        - Inventory / gear / parts
        - Vehicles / garage / upgrades
        - Racing
        - Jobs / crime / heat
        - Crew
        - Phone apps
        - Story / dialogue / onboarding
        - World / scenes / interactions
        - UI / HUD / settings
        - Audio
        - Accounts / login / linking
        - Events / car meets
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      placeholder: Opened the Scrapyard with 3 parts selected and the total showed 0 coins.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false

  - type: dropdown
    id: frequency
    attributes:
      label: How often
      options:
        - Every time
        - Sometimes
        - Once
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Blocks progress or loses data = critical.
      options:
        - Cosmetic
        - Minor (annoying, has a workaround)
        - Major (feature broken)
        - Critical (blocks progress, loses items or currency, crashes)
    validations:
      required: true

  - type: input
    id: account
    attributes:
      label: Player name / account
      description: Helps look up server logs. No passwords or tokens.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Player.log excerpt / screenshots
      description: "%USERPROFILE%\\AppData\\LocalLow\\<company>\\OctaneRPG\\Player.log (last 50-100 lines around the problem)"
      render: shell
    validations:
      required: false
